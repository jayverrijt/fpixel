name: FPixelCore
version: '1.0.0'
main: net.fpixel.FPixelPlugin
api-version: '1.21'
author: FPixelTeam
description: Complete Hypixel-grade minigame server framework with Geyser/Floodgate crossplay
softdepend:
  - floodgate
  - Geyser-Spigot
commands:
  fpixel:
    description: Main FPixel Network command
    permission: fpixel.admin
  lobby:
    description: Teleport to network hub / lobby
    aliases: [hub, l, spawn]
  join:
    description: Join a minigame arena
    aliases: [play]
  setrank:
    description: Set a player's rank
    permission: fpixel.admin
  maps:
    description: Browse and select a minigame map
    aliases: [map]
  duels:
    description: Challenge players to 1v1 duels
    aliases: [duel]
  party:
    description: Group up with friends and play minigames together
    aliases: [p]
  forcestart:
    description: Force start the arena countdown immediately
    aliases: [start]
  fly:
    description: Toggle flight mode in the Lobby (VIP+ or higher)
    aliases: [flight]
  survival:
    description: Join the Survival SMP world
    aliases: [smp]
  testing:
    description: Toggle testing mode and manage simulated players for game testing
    aliases: [test]
  shop:
    description: Open the BedWars item shop
  webpass:
    description: Stel je wachtwoord in voor het FPixel webportaal
    aliases: [setwebpass, webpassword]
  secrets:
    description: View your discovered ancient relics and lore
    aliases: [secret, lore, relics]
  survivalbackup:
    description: Trigger an immediate survival world backup pushed directly to GitHub
    permission: fpixel.admin
    aliases: [backupnow, smpbackup]
  coins:
    description: Manage and view your FPixel coins
    aliases: [coin, eco, money, balance]
  addcoins:
    description: Add coins to a player
    permission: fpixel.admin
  fillchunk:
    description: Fill current chunk with air between Y levels with ocean glass protection
    permission: fpixel.admin
    aliases: [chunkfill, clearchunk, chunkclear, fillchunck, chunckfill, clearchunck, floodfill, fillflood, chunkflood]
  glasswall:
    description: Build glass walls between ocean and build chunks, dry loose water, and restore ocean
    permission: fpixel.admin
    aliases: [glazenmuur, sealarea, fixwater, fixocean, waterwall]
  cleansponge:
    description: Remove all sponges, wet sponges, and glass in the chunk with air
    permission: fpixel.admin
    aliases: [spongeclean, removesponge, clearsponge]
  cleanglass:
    description: Remove glass that actively holds back an ocean/water
    permission: fpixel.admin
    aliases: [glassclean]
  cleanwaterandglass:
    description: Remove all water, glass, and sponges across chunk radius with air
    permission: fpixel.admin
    aliases: [cleanwaterglass, cleanwater, cleanglasswater, waterandglass, cleanall]
  pos1:
    description: Set position 1 for region selection
    permission: fpixel.admin
    aliases: [hpos1]
  pos2:
    description: Set position 2 for region selection
    permission: fpixel.admin
    aliases: [hpos2]
  wand:
    description: Get the region selection wooden axe wand
    permission: fpixel.admin
    aliases: [selectwand]
  set:
    description: Fill the selected region with a block
    permission: fpixel.admin
    aliases: [fillregion, regionfill]
  replace:
    description: Replace specific blocks in the selected region
    permission: fpixel.admin
    aliases: [replaceregion]
  undo:
    description: Undo the last WorldEdit / chunk action
    permission: fpixel.admin
    aliases: [weundo]



